<title>Exit Countdown</title>
<style>
:root{--bg:#f8f9f6;--card:#fff;--text:#203a32;--muted:#78847e;--border:#e3e9e3;--orange:#2d7059;--pink:#69786d;--teal:#2d7059;--navh:72px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #80b99d;outline-offset:4px}.app{max-width:1020px;margin:auto;padding:40px 24px 130px}.masthead{display:flex;justify-content:space-between;align-items:center;padding:0 0 36px;font-size:13px;letter-spacing:.08em}.brand{font-weight:750}.brand i{display:inline-block;width:9px;height:9px;background:#5c9473;border-radius:50%;margin-right:10px}.edition{color:var(--muted);font-size:11px}.view{display:none}.view.active{display:block;animation:appear .3s ease}.soft,.month,.setting{background:var(--card);border:1px solid var(--border);border-radius:24px}.hero{position:relative;overflow:hidden;padding:42px;background:#eaf1e9}.hero:after{content:"";position:absolute;width:330px;height:330px;border:1px solid #d2e0d0;border-radius:50%;right:-150px;top:-125px;pointer-events:none;box-shadow:0 0 0 40px #e4ede2,0 0 0 41px #d7e3d4}.eyebrow{position:relative;z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:#587463}.hero-title{font-size:30px;margin-top:22px;font-weight:500;letter-spacing:-.04em}.hero-sub:empty{display:none}.hero-sub{font-size:14px;color:#6e8073;line-height:1.8;margin-top:8px}.big-row{display:flex;align-items:baseline;gap:16px;margin:24px 0 16px}.big{font-size:clamp(88px,15vw,150px);font-weight:400;line-height:1.05;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.big-label{font-size:15px;color:#60776a}.realtime{font-size:13px;color:#5c7364;font-variant-numeric:tabular-nums}.count-rule{font-size:11px;color:#718476;margin-top:10px}.progress-wrap{margin-top:28px}.progress-label{display:flex;justify-content:space-between;font-size:11px;color:#607568;margin-bottom:9px}.progress-track{height:5px;background:#d9e4d7;border-radius:9px;overflow:hidden}.progress-fill{height:100%;background:#62896c;transition:width .4s}.pills{display:grid;grid-template-columns:1fr;gap:12px;margin-top:26px}.pill{background:rgba(255,255,255,.65);padding:16px;border:1px solid #dbe5d8;border-radius:14px;font-size:12px;line-height:1.7;color:#526c5a}.section{margin-top:22px}.card{padding:26px}.section-title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}.milestone{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--border);cursor:pointer}.milestone:last-child{border:0;padding-bottom:4px}.m-title{font-size:15px;font-weight:600}.m-sub{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}.status{font-size:10px;letter-spacing:.06em;padding:7px 10px;border-radius:7px;white-space:nowrap;background:#f0f3ef;color:#6b8070}.status.today{background:#2d7059;color:white}.status.done{color:#9aa49d;background:#f5f6f3}.page-title{font-size:32px;font-weight:500;letter-spacing:-.04em;margin:0 0 24px}.months{display:grid;grid-template-columns:1fr 1fr;gap:18px}.month{padding:22px}.month-title{font-size:16px;font-weight:600;margin-bottom:22px}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:10px;color:var(--muted);padding-bottom:10px}.day{min-width:0;min-height:58px;padding:6px 3px;border:1px solid #edf0ea;border-radius:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer}.day.empty{border:0;cursor:default}.day.past{opacity:.4}.day.outscope{opacity:.2}.day.today{outline:2px solid #2d7059;outline-offset:1px}.day.rest{background:#f2f3ef}.day.leave{background:#f0eefa}.day.comp{background:#fff3df}.day.tender,.day.last{background:#e2eee3}.day-num{font-size:12px;padding-left:3px}.tag{font-size:8px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#849084}.last10{display:none;margin-top:26px}.last10.show{display:block}.last10-list{display:grid;gap:8px;margin-top:14px}.last10-item{display:flex;justify-content:space-between;padding:14px;background:#f3f6f0;border-radius:10px;font-size:13px}.settings-grid{display:grid;gap:14px}.setting{padding:20px}.setting label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}.setting input{width:100%;min-width:0;height:48px;border:1px solid var(--border);border-radius:10px;background:#f8faf6;padding:0 12px;color:var(--text);font-size:16px}.helper{font-size:12px;line-height:1.6;margin-top:8px;color:var(--muted)}.actions{display:flex;gap:10px}.btn{border:0;border-radius:12px;padding:14px 20px;font-size:13px}.btn-primary{background:#2d7059;color:#fff}.btn-secondary{background:#e8ede6;color:#496451}.nav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));height:72px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #e2e8df;border-radius:22px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);z-index:20;box-shadow:0 8px 35px #243f2a0d;touch-action:pan-y}.nav button{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;border:0;border-radius:15px;background:none;color:#8a958b}.nav button.active{color:#2d7059}.icon{font-size:21px;line-height:1}.nav-slider{position:absolute;top:7px;left:7px;width:calc((100% - 14px)/4);height:calc(100% - 14px);border-radius:15px;background:#edf3e9;transition:transform .3s}.nav-slider.dragging{transition:none}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#203a3240;padding:20px;z-index:30}.modal.show{display:flex}.sheet{width:min(500px,100%);padding:26px;border-radius:24px;background:white}.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheet-title{font-size:18px;font-weight:600}.sheet-close{border:0;background:#f0f4ec;border-radius:50%;width:34px;height:34px}.sheet-body{font-size:14px;line-height:1.8;color:var(--muted);margin-top:18px}.footer{margin-top:26px;text-align:center;color:#98a395;font-size:10px;letter-spacing:.12em}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:640px){.app{padding:24px 18px 125px}.masthead{padding-bottom:25px}.edition{font-size:9px}.hero{padding:28px 24px}.hero-title{font-size:26px}.pills{grid-template-columns:1fr;gap:8px}.pill{padding:12px 14px}.months{grid-template-columns:1fr}.card{padding:22px}.big{font-size:108px}.hero:after{right:-225px}.big-row{gap:12px}.big-label{font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="masthead"><div class="brand"><i></i>THE NEXT CHAPTER</div><div class="edition">BRYAN · EXIT COUNTDOWN / 2026</div></header>
  <section id="view-home" class="view active">
    <section class="soft hero">
      <div class="eyebrow">Exit Countdown</div>
      <div id="hero-title" class="hero-title">Loading…</div>
      <div id="hero-sub" class="hero-sub"></div>
      <div class="big-row"><div id="hero-big" class="big">--</div><div id="hero-label" class="big-label">--</div></div>
      <div id="hero-realtime" class="realtime">--</div>
      <div class="count-rule">从明天开始计算 · 不含当天 · 新加坡时间</div><div class="progress-wrap"><div class="progress-label"><span>NOTICE PERIOD</span><span id="progress-label"></span></div><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div></div><div class="pills">
        <div id="pill-last" class="pill pill-last">--</div>
      </div>
    </section>

    <section class="soft card section">
      <div class="section-title">Next Milestone</div>
      <div id="next-milestone"></div>
    </section>
  </section>

  <section id="view-milestones" class="view">
    <div class="page-title">Milestones</div>
    <section class="soft card">
      <div id="milestones"></div>
      <div id="last10-wrap" class="last10">
        <div class="section-title">最后 10 个工作日</div>
        <div id="last10-list" class="last10-list"></div>
      </div>
    </section>
  </section>

  <section id="view-calendar" class="view">
    <div class="page-title">Calendar</div>
    <div id="calendar" class="months"></div>
  </section>

  <section id="view-settings" class="view">
    <div class="page-title">Settings</div>
    <div class="settings-grid">
      <div class="setting">
        <label for="tenderDateInput">丢信日</label>
        <input id="tenderDateInput" type="date">
      </div>
      <div class="setting">
        <label for="lastDateInput">最后一天</label>
        <input id="lastDateInput" type="date">
      </div>
      <div class="setting">
        <label for="lastTimeInput">最后下班时间</label>
        <input id="lastTimeInput" type="time">
      </div>
      <div class="setting">
        <label for="leaveInput">请假日</label>
        <input id="leaveInput" type="text" placeholder="2026-09-30, 2026-10-01, 2026-10-02">
        <div class="helper">多个日期用逗号分开。格式：YYYY-MM-DD</div>
      </div>
      <div class="setting">
        <label for="compInput">补休日 / Off in Lieu</label>
        <input id="compInput" type="text" placeholder="2026-11-10">
      </div>
      <div class="setting">
        <label for="restDayInput">固定休息日</label>
        <input id="restDayInput" type="text" value="Monday" disabled>
        <div class="helper">目前固定为每周一。</div>
      </div>
      <div class="actions">
        <button id="saveSettings" class="btn btn-primary" type="button">保存设置</button>
        <button id="resetSettings" class="btn btn-secondary" type="button">恢复默认</button>
      </div>
      <div id="settingsMsg" class="helper"></div>
    </div>
  </section>

  <div class="footer">ONE DAY CLOSER TO A NEW BEGINNING</div>
</main>

<nav class="nav" aria-label="Bottom navigation">
  <div class="nav-slider" aria-hidden="true"></div>

  <button class="active" data-view="home" type="button">
    <span class="icon">⌂</span>
    <span>Home</span>
  </button>

  <button data-view="milestones" type="button">
    <span class="icon">◎</span>
    <span>Milestones</span>
  </button>

  <button data-view="calendar" type="button">
    <span class="icon">▦</span>
    <span>Calendar</span>
  </button>

  <button data-view="settings" type="button">
    <span class="icon">⚙</span>
    <span>Settings</span>
  </button>
</nav>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet">
    <div class="sheet-top">
      <div id="modal-title" class="sheet-title"></div>
      <button id="modal-close" class="sheet-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="modal-body" class="sheet-body"></div>
  </div>
</div>

<script>
(()=>{
const DEFAULTS={
  tenderDate:'2026-10-07',
  lastDate:'2026-12-06',
  lastTime:'19:30',
  leaves:['2026-09-30','2026-10-01','2026-10-02'],
  comp:['2026-11-10']
};
let config=loadConfig();

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const sod=d=>new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
const add=(d,n)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x};
const isMon=d=>d.getUTCDay()===1;
const fmt=d=>d.toLocaleDateString('en-SG',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'});
const fmtShort=d=>d.toLocaleDateString('en-SG',{timeZone:'UTC',day:'numeric',month:'short'});
const wd=d=>d.toLocaleDateString('en-SG',{timeZone:'UTC',weekday:'short'});
const same=(a,b)=>ymd(a)===ymd(b);

function loadConfig(){
  try{
    const saved=JSON.parse(localStorage.getItem('exitCountdownConfig')||'null');
    return saved?{...DEFAULTS,...saved}:structuredClone(DEFAULTS);
  }catch(e){return structuredClone(DEFAULTS)}
}
function saveConfig(){localStorage.setItem('exitCountdownConfig',JSON.stringify(config))}
function tenderDate(){return new Date(`${config.tenderDate}T00:00:00Z`)}
function lastDay(){return new Date(`${config.lastDate}T00:00:00Z`)}
function lastDateTime(){return new Date(`${config.lastDate}T${config.lastTime}:00Z`)}
function leaves(){return new Set(config.leaves)}
function comps(){return new Set(config.comp)}
function workTender(d){return !isMon(d)&&!leaves().has(ymd(d))}
function workLast(d){return !isMon(d)&&!leaves().has(ymd(d))&&!comps().has(ymd(d))}
function countWork(from,to,mode){
  let count=0,c=sod(from),end=sod(to);
  while(c<=end){if((mode==='tender'?workTender(c):workLast(c)))count++;c=add(c,1)}
  return count;
}
function listWork(from,to,mode){
  const out=[];let c=sod(from),end=sod(to);
  while(c<=end){if((mode==='tender'?workTender(c):workLast(c)))out.push(new Date(c));c=add(c,1)}
  return out;
}
function countdown(target,now){
  const t=Math.floor(Math.max(0,target-now)/1000);
  return{days:Math.floor(t/86400),hours:Math.floor((t%86400)/3600),minutes:Math.floor((t%3600)/60),seconds:t%60};
}
function stage(now){
  const tender=tenderDate(),last=lastDay(),lastDT=lastDateTime();
  if(now<tender)return'pre';
  if(ymd(now)===ymd(last)&&now<lastDT)return'last';
  if(now<lastDT)return'notice';
  return'done';
}
function milestoneDate(targetCount){
  let d=add(tenderDate(),1),end=lastDay();
  while(d<=end){if(workLast(d)&&countWork(add(d,1),end,'last')===targetCount)return new Date(d);d=add(d,1)}
  return null;
}
function lastWeekend(){
  let d=sod(lastDay()),start=add(tenderDate(),1);
  while(d>=start){if(d.getUTCDay()===6)return new Date(d);d=add(d,-1)}
  return null;
}
function milestonesData(){
  const w=lastWeekend();
  return[
    {title:'Q3 Bonus💰 + 丢信！！',date:tenderDate(),sub:'奖金到账 · 提交辞职信'},
    {title:'剩30个工作日',date:milestoneDate(30),sub:'进入30个工作日倒数'},
    {title:'剩10个工作日',date:milestoneDate(10),sub:''},
    {title:'最后一个周末班',date:w,sub:w?`${fmtShort(w)} – ${fmtShort(add(w,1))}`:''},
    {title:'Last Day',date:lastDay(),sub:`${fmtShort(lastDay())} · ${config.lastTime}`}
  ].filter(x=>x.date);
}

function renderHero(now){
  const tender=tenderDate(),last=lastDay(),lastDT=lastDateTime(),s=stage(now),today=sod(now);
  const nT=countdown(tender,now),nL=countdown(lastDT,now);
  const calendarDays=target=>Math.max(0,Math.round((sod(target)-today)/86400000));
  const elapsed=Math.max(0,Math.min(1,(now-tender)/(lastDT-tender)));
  document.getElementById('progress-label').textContent=`${Math.round(elapsed*100)}%`;
  document.getElementById('progress-fill').style.width=`${elapsed*100}%`;
  const wT=today<=tender?countWork(add(today,1),tender,'tender'):0;
  const wL=today<=last?countWork(add(today,1),last,'last'):0;
  document.getElementById('pill-last').textContent=`Last Day 自然日 ${calendarDays(last)}天（${wL}个工作日） · ${pad(nL.hours)}:${pad(nL.minutes)}:${pad(nL.seconds)}`;
  if(s==='pre'){
    document.getElementById('hero-title').textContent='距离丢信还有';
    document.getElementById('hero-sub').textContent='先到 10月7日。Q3 Bonus到账，然后丢信。';
    document.getElementById('hero-big').textContent=wT;
    document.getElementById('hero-label').textContent='个工作日';
    document.getElementById('hero-realtime').textContent=`自然时间还剩 ${nT.days}天 ${nT.hours}小时 ${nT.minutes}分 ${nT.seconds}秒`;
  }else if(s==='notice'){
    document.getElementById('hero-title').textContent='距离最后下班，还有';
    document.getElementById('hero-sub').textContent='';
    document.getElementById('hero-big').textContent=wL;
    document.getElementById('hero-label').textContent='个工作日';
    document.getElementById('hero-realtime').textContent=`距离 Last Day 还剩 ${nL.days}天 ${nL.hours}小时 ${nL.minutes}分 ${nL.seconds}秒`;
  }else if(s==='last'){
    const x=countdown(lastDT,now);
    document.getElementById('hero-title').textContent='LAST DAY';
    document.getElementById('hero-sub').textContent=`今天 ${config.lastTime}，正式结束。`;
    document.getElementById('hero-big').textContent=`${pad(x.hours)}:${pad(x.minutes)}:${pad(x.seconds)}`;
    document.getElementById('hero-label').textContent='到下班';
    document.getElementById('hero-realtime').textContent='最后一天。';
  }else{
    document.getElementById('hero-title').textContent='Completed';
    document.getElementById('hero-sub').textContent='Tree Art 这一段正式结束。';
    document.getElementById('hero-big').textContent='✓';
    document.getElementById('hero-label').textContent='Done';
    document.getElementById('hero-realtime').textContent='';
  }
}

function milestoneRow(item,now){
  const row=document.createElement('div');row.className='milestone';
  const left=document.createElement('div');left.innerHTML=`<div class="m-title">${item.title}</div><div class="m-sub">${fmt(item.date)}${item.sub?' · '+item.sub:''}</div>`;
  const st=document.createElement('div');st.className='status';
  const d=sod(item.date),n=sod(now);
  if(d<n){st.classList.add('done');st.textContent='DONE'}else if(d.getTime()===n.getTime()){st.classList.add('today');st.textContent='TODAY'}else{st.classList.add('upcoming');st.textContent='UPCOMING'}
  row.append(left,st);
  row.addEventListener('click',()=>{openModal(item.title,`${fmt(item.date)}<br>${item.sub}`)});
  return row;
}
function renderMilestones(now){
  const items=milestonesData().filter(item=>sod(item.date)>=sod(now)),box=document.getElementById('milestones');box.innerHTML='';
  items.forEach(item=>box.appendChild(milestoneRow(item,now)));
  const upcoming=items[0];
  const next=document.getElementById('next-milestone');next.innerHTML='';
  next.parentElement.hidden=!upcoming;
  if(upcoming) next.appendChild(milestoneRow(upcoming,now));
  if(!items.length){const empty=document.createElement('div');empty.className='helper';empty.textContent='所有里程碑已完成。';box.appendChild(empty);}
  const rem=sod(now)<=lastDay()?countWork(add(sod(now),1),lastDay(),'last'):0;
  const wrap=document.getElementById('last10-wrap'),list=document.getElementById('last10-list');
  if((stage(now)==='notice'||stage(now)==='last')&&rem>0&&rem<=10){
    wrap.classList.add('show');list.innerHTML='';
    listWork(add(sod(now),1),lastDay(),'last').slice(0,10).forEach((d,idx)=>{
      const row=document.createElement('div');row.className='last10-item';
      row.innerHTML=`<span>${fmtShort(d)} · ${wd(d)}</span><span style="color:#8e8e93">剩 ${rem-idx} 天</span>`;
      list.appendChild(row);
    });
  }else wrap.classList.remove('show');
}
function dayMeta(d,now){
  const id=ymd(d),cls=['day'],tags=[];
  if(sod(d)<sod(now))cls.push('past');
  if(same(d,now))cls.push('today');
  if(id>config.lastDate){cls.push('outscope');return{cls,tags,label:'计划结束后'}}
  if(id===config.tenderDate){cls.push('tender');tags.push(['Bonus + Tender','tag-tender']);return{cls,tags,label:'Q3 Bonus到账 + 丢信'}}
  if(id===config.lastDate){cls.push('last');tags.push(['Last Day','tag-last']);return{cls,tags,label:'Last Day'}}
  if(leaves().has(id)){cls.push('leave');tags.push(['Leave','']);return{cls,tags,label:'请假'}}
  if(comps().has(id)){cls.push('comp');tags.push(['Off in Lieu','']);return{cls,tags,label:'补休 / Off in Lieu'}}
  if(isMon(d)){cls.push('rest');tags.push(['Rest','']);return{cls,tags,label:'休息日'}}
  tags.push(['Work','']);return{cls,tags,label:'工作日'};
}
function renderCalendar(now){
  const wrap=document.getElementById('calendar');wrap.innerHTML='';
  for(let month=8;month<=11;month++){
    const first=new Date(Date.UTC(2026,month,1)),last=new Date(Date.UTC(2026,month+1,0)),card=document.createElement('section');card.className='month';
    const title=document.createElement('div');title.className='month-title';title.textContent=first.toLocaleDateString('en-SG',{timeZone:'UTC',month:'long',year:'numeric'});card.appendChild(title);
    const weekdays=document.createElement('div');weekdays.className='weekgrid';
    ['S','M','T','W','T','F','S'].forEach(x=>{const el=document.createElement('div');el.className='weekday';el.textContent=x;weekdays.appendChild(el)});card.appendChild(weekdays);
    const grid=document.createElement('div');grid.className='weekgrid';
    for(let i=0;i<first.getUTCDay();i++){const empty=document.createElement('div');empty.className='day empty';grid.appendChild(empty)}
    for(let n=1;n<=last.getUTCDate();n++){
      const d=new Date(Date.UTC(2026,month,n)),meta=dayMeta(d,now),cell=document.createElement('div');cell.className=meta.cls.join(' ');
      const num=document.createElement('div');num.className='day-num';num.textContent=n;cell.appendChild(num);
      meta.tags.forEach(([text,extra])=>{const tag=document.createElement('div');tag.className=`tag ${extra}`;tag.textContent=text;cell.appendChild(tag)});
      cell.addEventListener('click',()=>openModal(`${fmt(d)} · ${wd(d)}`,meta.label));
      grid.appendChild(cell);
    }
    card.appendChild(grid);wrap.appendChild(card);
  }
}

function openModal(title,body){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}

function bindNav(){
  const nav = document.querySelector('.nav');
  const slider = document.querySelector('.nav-slider');
  const buttons = [...document.querySelectorAll('.nav button')];

  let activeIndex = Math.max(0, buttons.findIndex(b => b.classList.contains('active')));
  let dragging = false;
  let dragX = 0;

  function sliderWidth(){
    return (nav.clientWidth - 14) / buttons.length;
  }

  function clampX(x){
    const width = sliderWidth();
    const min = 0;
    const max = nav.clientWidth - 14 - width;
    return Math.max(min, Math.min(max, x));
  }

  function moveSliderToIndex(index, animate = true){
    const width = sliderWidth();
    slider.classList.toggle('dragging', !animate);
    dragX = index * width;
    slider.style.transform = `translateX(${dragX}px)`;
  }

  function switchView(index){
    index = Math.max(0, Math.min(buttons.length - 1, index));
    activeIndex = index;

    const btn = buttons[index];
    const target = btn.dataset.view;

    buttons.forEach((b,i)=>b.classList.toggle('active', i === index));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(`view-${target}`).classList.add('active');

    moveSliderToIndex(index, true);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  buttons.forEach((btn,index)=>{
    btn.addEventListener('click',()=>switchView(index));
  });

  nav.addEventListener('pointerdown',(e)=>{
    dragging = true;
    slider.classList.add('dragging');
    nav.setPointerCapture(e.pointerId);

    const rect = nav.getBoundingClientRect();
    const width = sliderWidth();
    dragX = clampX(e.clientX - rect.left - 7 - width / 2);
    slider.style.transform = `translateX(${dragX}px)`;
  });

  nav.addEventListener('pointermove',(e)=>{
    if(!dragging) return;

    const rect = nav.getBoundingClientRect();
    const width = sliderWidth();
    dragX = clampX(e.clientX - rect.left - 7 - width / 2);
    slider.style.transform = `translateX(${dragX}px)`;
  });

  function endDrag(){
    if(!dragging) return;
    dragging = false;
    slider.classList.remove('dragging');

    const width = sliderWidth();
    const nearestIndex = Math.round(dragX / width);
    switchView(nearestIndex);
  }

  nav.addEventListener('pointerup', endDrag);
  nav.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize',()=>moveSliderToIndex(activeIndex,false));
  moveSliderToIndex(activeIndex,false);
}

function fillSettings(){
  document.getElementById('tenderDateInput').value=config.tenderDate;
  document.getElementById('lastDateInput').value=config.lastDate;
  document.getElementById('lastTimeInput').value=config.lastTime;
  document.getElementById('leaveInput').value=config.leaves.join(', ');
  document.getElementById('compInput').value=config.comp.join(', ');
}

function parseDates(text){
  return text.split(',').map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
}

document.getElementById('saveSettings').addEventListener('click',()=>{
  const tenderValue=document.getElementById('tenderDateInput').value;
  const lastValue=document.getElementById('lastDateInput').value;
  const validDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x))&&new Date(x).toISOString().slice(0,10)===x;
  const rawDates=[document.getElementById('leaveInput').value,document.getElementById('compInput').value].join(',').split(',').map(x=>x.trim()).filter(Boolean);
  if(!validDate(tenderValue)||!validDate(lastValue)||lastValue<tenderValue||rawDates.some(x=>!validDate(x))){document.getElementById('settingsMsg').textContent='请检查日期格式，最后一天不能早于丢信日。';return;}
  config={
    tenderDate:document.getElementById('tenderDateInput').value||DEFAULTS.tenderDate,
    lastDate:document.getElementById('lastDateInput').value||DEFAULTS.lastDate,
    lastTime:document.getElementById('lastTimeInput').value||DEFAULTS.lastTime,
    leaves:parseDates(document.getElementById('leaveInput').value),
    comp:parseDates(document.getElementById('compInput').value)
  };
  saveConfig();
  document.getElementById('settingsMsg').textContent='已保存。页面倒数已更新。';
  tick();
});

document.getElementById('resetSettings').addEventListener('click',()=>{
  config=structuredClone(DEFAULTS);
  saveConfig();
  fillSettings();
  document.getElementById('settingsMsg').textContent='已恢复默认设置。';
  tick();
});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal') closeModal();
});

bindNav();
fillSettings();

function tick(){
  const now=new Date(Date.now()+8*3600000);
  renderHero(now);
  const key=ymd(now)+JSON.stringify(config);
  if(tick.key!==key){renderMilestones(now);renderCalendar(now);tick.key=key;}
}

tick();
setInterval(tick,1000);
})();
</script>
</body>
