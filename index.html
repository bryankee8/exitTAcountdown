<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Exit Countdown">
<title>Exit Countdown</title>
<style>
:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#1c1c1e;
  --muted:#8e8e93;
  --border:#ececee;
  --orange:#ff8a00;
  --pink:#9b4dca;
  --teal:#008b8b;
  --navh:72px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input{font:inherit}
.app{max-width:920px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(var(--navh) + 28px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block}
.soft{background:#fff;border:1px solid var(--border);border-radius:22px}
.hero{padding:24px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero-title{margin-top:10px;font-size:28px;font-weight:650}
.hero-sub{margin-top:6px;color:var(--muted);font-size:15px;line-height:1.5}
.big-row{margin-top:28px;display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big{font-size:78px;line-height:.95;font-weight:700;letter-spacing:-.055em;color:var(--orange)}
.big-label{padding-bottom:6px;color:var(--muted);font-size:18px}
.realtime{margin-top:18px;font-size:14px;color:var(--muted)}
.pills{margin-top:18px;display:grid;gap:10px}
.pill{border-radius:16px;padding:12px 14px;font-size:13px;font-weight:650;line-height:1.4}
.pill-tender{background:linear-gradient(135deg,#f7efff,#fff0f7);border:1px solid #ead8ff;color:var(--pink)}
.pill-last{background:linear-gradient(135deg,#ecfbff,#effff7);border:1px solid #cceff1;color:var(--teal)}
.section{margin-top:16px}
.card{padding:18px}
.section-title{font-size:14px;font-weight:700}
.milestone{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #efefef;cursor:pointer}
.milestone:last-child{border-bottom:none}
.m-title{font-size:14px;font-weight:650}
.m-sub{margin-top:4px;font-size:12px;color:var(--muted)}
.status{font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px;background:#f4f4f5;color:#666;white-space:nowrap}
.status.today{background:var(--orange);color:#fff}
.status.done{background:#f1f1f1;color:#aaa}
.status.upcoming{background:#f3f0ff;color:#7256c7}
.months{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.month{background:#fff;border:1px solid var(--border);border-radius:20px;padding:14px}
.month-title{font-size:14px;font-weight:700;margin-bottom:10px}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.weekday{font-size:10px;text-align:center;color:var(--muted);margin-bottom:4px}
.day{min-height:50px;border:1px solid #efefef;border-radius:11px;padding:5px;background:#fff;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.day.empty{border:none;background:transparent;cursor:default}
.day.past{opacity:.3;background:#fafafa}
.day.outscope{opacity:.22;background:#fff;border-color:#f4f4f4}
.day.today{outline:2px solid #1c1c1e;outline-offset:1px}
.day.rest{background:#f7f7f8}
.day.leave{background:#f8f2ff}
.day.comp{background:#fff7e8}
.day.tender{background:#fff3e8;border-color:#ffd6ad}
.day.last{background:#eefdf8;border-color:#c9f2e4}
.day-num{font-size:12px;font-weight:600}
.tag{font-size:9px;line-height:1.1;color:#6b6b70;border-radius:999px;background:#f1f1f2;padding:3px 5px;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-tender{background:#ffe2c2;color:#b85c00}
.tag-last{background:#d7f7ec;color:#06745f}
.last10{margin-top:16px;display:none}
.last10.show{display:block}
.last10-list{margin-top:10px;display:grid;gap:7px}
.last10-item{display:flex;justify-content:space-between;gap:10px;border:1px solid #eee;border-radius:12px;padding:11px 12px;font-size:13px}
.last10-item:nth-child(1){background:#fff2e8}.last10-item:nth-child(2){background:#fff7df}.last10-item:nth-child(3){background:#eefbf2}.last10-item:nth-child(4){background:#eaf8ff}.last10-item:nth-child(5){background:#f2efff}
.last10-item:nth-child(6){background:#fff0f6}.last10-item:nth-child(7){background:#fff2e8}.last10-item:nth-child(8){background:#eefbf2}.last10-item:nth-child(9){background:#eaf8ff}.last10-item:nth-child(10){background:#f2efff}
.page-title{font-size:28px;font-weight:700;margin:4px 0 14px}
.settings-grid{display:grid;gap:14px}
.setting{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px}
.setting label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}
.setting input{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px 13px;background:#fafafa;color:var(--text);font-size:16px}
.helper{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}
.btn{border:none;border-radius:14px;padding:12px 15px;font-weight:700;cursor:pointer}
.btn-primary{background:#111;color:white}
.btn-secondary{background:#efeff1;color:#222}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.nav{
  position:fixed;
  left:50%;
  bottom:calc(10px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(560px,calc(100% - 24px));
  height:var(--navh);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px;
  z-index:20;

  /* iOS-style frosted / liquid glass */
  background:
    linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,.30));
  border:1px solid rgba(255,255,255,.72);
  border-radius:24px;
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);
  box-shadow:
    0 10px 35px rgba(20,20,30,.12),
    0 2px 8px rgba(20,20,30,.05),
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -1px 0 rgba(255,255,255,.28);
  overflow:hidden;
}
.nav::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:inherit;
  background:
    radial-gradient(circle at 18% -10%,rgba(255,255,255,.85),transparent 34%),
    linear-gradient(110deg,rgba(255,255,255,.18),transparent 36%,rgba(255,255,255,.08) 70%,transparent);
  opacity:.75;
}
.nav button{
  position:relative;
  z-index:1;
  border:0;
  background:transparent;
  border-radius:17px;
  color:rgba(60,60,67,.68);
  font-size:11px;
  font-weight:650;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  transition:
    background .22s ease,
    color .22s ease,
    transform .18s ease,
    box-shadow .22s ease;
  -webkit-tap-highlight-color:transparent;
}
.nav button:active{
  transform:scale(.96);
}
.nav button.active{
  color:#111;
  background:
    linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.45));
  border:1px solid rgba(255,255,255,.72);
  box-shadow:
    0 4px 12px rgba(0,0,0,.07),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.34);
}
.nav .icon{
  font-size:18px;
  line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:12px}
.modal.show{display:flex}
.sheet{width:min(560px,100%);background:#fff;border-radius:24px;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 60px rgba(0,0,0,.2)}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sheet-title{font-size:18px;font-weight:700}
.sheet-close{border:none;background:#f2f2f7;width:34px;height:34px;border-radius:50%;cursor:pointer}
.sheet-body{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.6}
.footer{margin-top:18px;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}
@media(max-width:720px){.months{grid-template-columns:1fr}.big{font-size:72px}.hero-title{font-size:26px}}
</style>
</head>
<body>
<main class="app">
  <section id="view-home" class="view active">
    <section class="soft hero">
      <div class="eyebrow">Exit Countdown</div>
      <div id="hero-title" class="hero-title">Loading…</div>
      <div id="hero-sub" class="hero-sub"></div>
      <div class="big-row"><div id="hero-big" class="big">--</div><div id="hero-label" class="big-label">--</div></div>
      <div id="hero-realtime" class="realtime">--</div>
      <div class="pills">
        <div id="pill-tender" class="pill pill-tender">--</div>
        <div id="pill-last" class="pill pill-last">--</div>
      </div>
    </section>

    <section class="soft card section">
      <div class="section-title">Next Milestone</div>
      <div id="next-milestone"></div>
    </section>
  </section>

  <section id="view-milestones" class="view">
    <div class="page-title">Milestones</div>
    <section class="soft card">
      <div id="milestones"></div>
      <div id="last10-wrap" class="last10">
        <div class="section-title">最后 10 个工作日</div>
        <div id="last10-list" class="last10-list"></div>
      </div>
    </section>
  </section>

  <section id="view-calendar" class="view">
    <div class="page-title">Calendar</div>
    <div id="calendar" class="months"></div>
  </section>

  <section id="view-settings" class="view">
    <div class="page-title">Settings</div>
    <div class="settings-grid">
      <div class="setting">
        <label for="tenderDateInput">丢信日</label>
        <input id="tenderDateInput" type="date">
      </div>
      <div class="setting">
        <label for="lastDateInput">最后一天</label>
        <input id="lastDateInput" type="date">
      </div>
      <div class="setting">
        <label for="lastTimeInput">最后下班时间</label>
        <input id="lastTimeInput" type="time">
      </div>
      <div class="setting">
        <label for="leaveInput">请假日</label>
        <input id="leaveInput" type="text" placeholder="2026-09-30, 2026-10-01, 2026-10-02">
        <div class="helper">多个日期用逗号分开。格式：YYYY-MM-DD</div>
      </div>
      <div class="setting">
        <label for="compInput">补休日 / Off in Lieu</label>
        <input id="compInput" type="text" placeholder="2026-11-10">
      </div>
      <div class="setting">
        <label for="restDayInput">固定休息日</label>
        <input id="restDayInput" type="text" value="Monday" disabled>
        <div class="helper">目前固定为每周一。</div>
      </div>
      <div class="actions">
        <button id="saveSettings" class="btn btn-primary" type="button">保存设置</button>
        <button id="resetSettings" class="btn btn-secondary" type="button">恢复默认</button>
      </div>
      <div id="settingsMsg" class="helper"></div>
    </div>
  </section>

  <div class="footer">Exit Countdown · 2026</div>
</main>

<nav class="nav" aria-label="Bottom navigation">
  <button class="active" data-view="home" type="button"><span class="icon">⌂</span><span>Home</span></button>
  <button data-view="milestones" type="button"><span class="icon">◎</span><span>Milestones</span></button>
  <button data-view="calendar" type="button"><span class="icon">▦</span><span>Calendar</span></button>
  <button data-view="settings" type="button"><span class="icon">⚙</span><span>Settings</span></button>
</nav>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet">
    <div class="sheet-top">
      <div id="modal-title" class="sheet-title"></div>
      <button id="modal-close" class="sheet-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="modal-body" class="sheet-body"></div>
  </div>
</div>

<script>
(()=>{
const DEFAULTS={
  tenderDate:'2026-10-07',
  lastDate:'2026-12-06',
  lastTime:'19:30',
  leaves:['2026-09-30','2026-10-01','2026-10-02'],
  comp:['2026-11-10']
};
let config=loadConfig();

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const isMon=d=>d.getDay()===1;
const fmt=d=>d.toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'});
const fmtShort=d=>d.toLocaleDateString('en-SG',{day:'numeric',month:'short'});
const wd=d=>d.toLocaleDateString('en-SG',{weekday:'short'});
const same=(a,b)=>ymd(a)===ymd(b);

function loadConfig(){
  try{
    const saved=JSON.parse(localStorage.getItem('exitCountdownConfig')||'null');
    return saved?{...DEFAULTS,...saved}:structuredClone(DEFAULTS);
  }catch(e){return structuredClone(DEFAULTS)}
}
function saveConfig(){localStorage.setItem('exitCountdownConfig',JSON.stringify(config))}
function tenderDate(){return new Date(`${config.tenderDate}T00:00:00+08:00`)}
function lastDay(){return new Date(`${config.lastDate}T00:00:00+08:00`)}
function lastDateTime(){return new Date(`${config.lastDate}T${config.lastTime}:00+08:00`)}
function leaves(){return new Set(config.leaves)}
function comps(){return new Set(config.comp)}
function workTender(d){return !isMon(d)&&!leaves().has(ymd(d))}
function workLast(d){return !isMon(d)&&!comps().has(ymd(d))}
function countWork(from,to,mode){
  let count=0,c=sod(from),end=sod(to);
  while(c<=end){if((mode==='tender'?workTender(c):workLast(c)))count++;c=add(c,1)}
  return count;
}
function listWork(from,to,mode){
  const out=[];let c=sod(from),end=sod(to);
  while(c<=end){if((mode==='tender'?workTender(c):workLast(c)))out.push(new Date(c));c=add(c,1)}
  return out;
}
function countdown(target,now){
  const t=Math.floor(Math.max(0,target-now)/1000);
  return{days:Math.floor(t/86400),hours:Math.floor((t%86400)/3600),minutes:Math.floor((t%3600)/60),seconds:t%60};
}
function stage(now){
  const tender=tenderDate(),last=lastDay(),lastDT=lastDateTime();
  if(now<tender)return'pre';
  if(ymd(now)===ymd(last)&&now<lastDT)return'last';
  if(now<lastDT)return'notice';
  return'done';
}
function milestoneDate(targetCount){
  let d=add(tenderDate(),1),end=lastDay();
  while(d<=end){if(workLast(d)&&countWork(d,end,'last')===targetCount)return new Date(d);d=add(d,1)}
  return null;
}
function lastWeekend(){
  let d=sod(lastDay()),start=add(tenderDate(),1);
  while(d>=start){if(d.getDay()===6)return new Date(d);d=add(d,-1)}
  return null;
}
function milestonesData(){
  const w=lastWeekend();
  return[
    {title:'Q3 Bonus💰 + 丢信！！',date:tenderDate(),sub:'奖金到账 · 提交辞职信'},
    {title:'剩30个工作日',date:milestoneDate(30),sub:'进入30个工作日倒数'},
    {title:'剩10个工作日',date:milestoneDate(10),sub:'开始一天一天数'},
    {title:'最后一个周末班',date:w,sub:w?`${fmtShort(w)} – ${fmtShort(add(w,1))}`:''},
    {title:'Last Day',date:lastDay(),sub:`${fmtShort(lastDay())} · ${config.lastTime}`}
  ].filter(x=>x.date);
}

function renderHero(now){
  const tender=tenderDate(),last=lastDay(),lastDT=lastDateTime(),s=stage(now),today=sod(now);
  const nT=countdown(tender,now),nL=countdown(lastDT,now);
  const wT=today<=tender?countWork(today,tender,'tender'):0;
  const wL=today<=last?countWork(today,last,'last'):0;
  document.getElementById('pill-tender').textContent=`丢信自然日 ${nT.days}天（${wT}个工作日） · ${pad(nT.hours)}:${pad(nT.minutes)}:${pad(nT.seconds)}`;
  document.getElementById('pill-last').textContent=`Last Day 自然日 ${nL.days}天（${wL}个工作日） · ${pad(nL.hours)}:${pad(nL.minutes)}:${pad(nL.seconds)}`;
  if(s==='pre'){
    document.getElementById('hero-title').textContent='距离丢信还有';
    document.getElementById('hero-sub').textContent='先到 10月7日。Q3 Bonus到账，然后丢信。';
    document.getElementById('hero-big').textContent=wT;
    document.getElementById('hero-label').textContent='个工作日';
    document.getElementById('hero-realtime').textContent=`自然时间还剩 ${nT.days}天 ${nT.hours}小时 ${nT.minutes}分 ${nT.seconds}秒`;
  }else if(s==='notice'){
    document.getElementById('hero-title').textContent='Notice Period';
    document.getElementById('hero-sub').textContent='辞职已经提交。现在只是在完成最后一段倒数。';
    document.getElementById('hero-big').textContent=wL;
    document.getElementById('hero-label').textContent='个工作日';
    document.getElementById('hero-realtime').textContent=`距离 Last Day 还剩 ${nL.days}天 ${nL.hours}小时 ${nL.minutes}分 ${nL.seconds}秒`;
  }else if(s==='last'){
    const x=countdown(lastDT,now);
    document.getElementById('hero-title').textContent='LAST DAY';
    document.getElementById('hero-sub').textContent=`今天 ${config.lastTime}，正式结束。`;
    document.getElementById('hero-big').textContent=`${pad(x.hours)}:${pad(x.minutes)}:${pad(x.seconds)}`;
    document.getElementById('hero-label').textContent='到下班';
    document.getElementById('hero-realtime').textContent='最后一天。';
  }else{
    document.getElementById('hero-title').textContent='Completed';
    document.getElementById('hero-sub').textContent='Tree Art 这一段正式结束。';
    document.getElementById('hero-big').textContent='✓';
    document.getElementById('hero-label').textContent='Done';
    document.getElementById('hero-realtime').textContent='';
  }
}

function milestoneRow(item,now){
  const row=document.createElement('div');row.className='milestone';
  const left=document.createElement('div');left.innerHTML=`<div class="m-title">${item.title}</div><div class="m-sub">${fmt(item.date)} · ${item.sub}</div>`;
  const st=document.createElement('div');st.className='status';
  const d=sod(item.date),n=sod(now);
  if(d<n){st.classList.add('done');st.textContent='DONE'}else if(d.getTime()===n.getTime()){st.classList.add('today');st.textContent='TODAY'}else{st.classList.add('upcoming');st.textContent='UPCOMING'}
  row.append(left,st);
  row.addEventListener('click',()=>{openModal(item.title,`${fmt(item.date)}<br>${item.sub}`)});
  return row;
}
function renderMilestones(now){
  const items=milestonesData(),box=document.getElementById('milestones');box.innerHTML='';
  items.forEach(item=>box.appendChild(milestoneRow(item,now)));
  const upcoming=items.find(x=>sod(x.date)>=sod(now))||items[items.length-1];
  const next=document.getElementById('next-milestone');next.innerHTML='';
  if(upcoming) next.appendChild(milestoneRow(upcoming,now));
  const rem=sod(now)<=lastDay()?countWork(sod(now),lastDay(),'last'):0;
  const wrap=document.getElementById('last10-wrap'),list=document.getElementById('last10-list');
  if((stage(now)==='notice'||stage(now)==='last')&&rem>0&&rem<=10){
    wrap.classList.add('show');list.innerHTML='';
    listWork(sod(now),lastDay(),'last').slice(0,10).forEach((d,idx)=>{
      const row=document.createElement('div');row.className='last10-item';
      row.innerHTML=`<span>${fmtShort(d)} · ${wd(d)}</span><span style="color:#8e8e93">剩 ${rem-idx} 天</span>`;
      list.appendChild(row);
    });
  }else wrap.classList.remove('show');
}
function dayMeta(d,now){
  const id=ymd(d),cls=['day'],tags=[];
  if(sod(d)<sod(now))cls.push('past');
  if(same(d,now))cls.push('today');
  if(id>config.lastDate){cls.push('outscope');return{cls,tags,label:'计划结束后'}}
  if(id===config.tenderDate){cls.push('tender');tags.push(['Bonus + Tender','tag-tender']);return{cls,tags,label:'Q3 Bonus到账 + 丢信'}}
  if(id===config.lastDate){cls.push('last');tags.push(['Last Day','tag-last']);return{cls,tags,label:'Last Day'}}
  if(leaves().has(id)){cls.push('leave');tags.push(['Leave','']);return{cls,tags,label:'请假'}}
  if(comps().has(id)){cls.push('comp');tags.push(['Off in Lieu','']);return{cls,tags,label:'补休 / Off in Lieu'}}
  if(isMon(d)){cls.push('rest');tags.push(['Rest','']);return{cls,tags,label:'休息日'}}
  tags.push(['Work','']);return{cls,tags,label:'工作日'};
}
function renderCalendar(now){
  const wrap=document.getElementById('calendar');wrap.innerHTML='';
  for(let month=8;month<=11;month++){
    const first=new Date(2026,month,1),last=new Date(2026,month+1,0),card=document.createElement('section');card.className='month';
    const title=document.createElement('div');title.className='month-title';title.textContent=first.toLocaleDateString('en-SG',{month:'long',year:'numeric'});card.appendChild(title);
    const weekdays=document.createElement('div');weekdays.className='weekgrid';
    ['S','M','T','W','T','F','S'].forEach(x=>{const el=document.createElement('div');el.className='weekday';el.textContent=x;weekdays.appendChild(el)});card.appendChild(weekdays);
    const grid=document.createElement('div');grid.className='weekgrid';
    for(let i=0;i<first.getDay();i++){const empty=document.createElement('div');empty.className='day empty';grid.appendChild(empty)}
    for(let n=1;n<=last.getDate();n++){
      const d=new Date(2026,month,n),meta=dayMeta(d,now),cell=document.createElement('div');cell.className=meta.cls.join(' ');
      const num=document.createElement('div');num.className='day-num';num.textContent=n;cell.appendChild(num);
      meta.tags.forEach(([text,extra])=>{const tag=document.createElement('div');tag.className=`tag ${extra}`;tag.textContent=text;cell.appendChild(tag)});
      cell.addEventListener('click',()=>openModal(`${fmt(d)} · ${wd(d)}`,meta.label));
      grid.appendChild(cell);
    }
    card.appendChild(grid);wrap.appendChild(card);
  }
}

function openModal(title,body){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}

function bindNav(){
  document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>{
    const target=btn.dataset.view;
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===btn));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(`view-${target}`).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }));
}
function fillSettings(){
  document.getElementById('tenderDateInput').value=config.tenderDate;
  document.getElementById('lastDateInput').value=config.lastDate;
  document.getElementById('lastTimeInput').value=config.lastTime;
  document.getElementById('leaveInput').value=config.leaves.join(', ');
  document.getElementById('compInput').value=config.comp.join(', ');
}
function parseDates(text){
  return text.split(',').map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
}
document.getElementById('saveSettings').addEventListener('click',()=>{
  config={
    tenderDate:document.getElementById('tenderDateInput').value||DEFAULTS.tenderDate,
    lastDate:document.getElementById('lastDateInput').value||DEFAULTS.lastDate,
    lastTime:document.getElementById('lastTimeInput').value||DEFAULTS.lastTime,
    leaves:parseDates(document.getElementById('leaveInput').value),
    comp:parseDates(document.getElementById('compInput').value)
  };
  saveConfig();document.getElementById('settingsMsg').textContent='已保存。页面倒数已更新。';tick();
});
document.getElementById('resetSettings').addEventListener('click',()=>{
  config=structuredClone(DEFAULTS);saveConfig();fillSettings();document.getElementById('settingsMsg').textContent='已恢复默认设置。';tick();
});
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

bindNav();fillSettings();
function tick(){const now=new Date();renderHero(now);renderMilestones(now);renderCalendar(now)}
tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
